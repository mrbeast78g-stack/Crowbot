name: Build BiggerDigger
on:
  push:
    paths:
      - 'BiggerDigger-source.zip'
      - '.github/workflows/build-biggerdigger.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Extract source
        run: |
          unzip BiggerDigger-source.zip
          mv BiggerDigger-Fabric-1.20.1 project
      - name: Build mod
        working-directory: project
        run: gradle build --no-daemon
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: BiggerDigger-Fabric-1.20.1
          path: project/build/libs/*.jar
          if-no-files-found: error
