name: Build BiggerDigger Fabric 1.20.1

on:
  push:
    paths:
      - 'BiggerDigger-Fabric-1.20.1.zip'
      - '.github/workflows/build-biggerdigger.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
      - name: Extract mod source
        run: |
          mkdir source
          unzip -q BiggerDigger-Fabric-1.20.1.zip -d source
          find source -maxdepth 3 -type f | head -40
      - name: Build Fabric mod
        run: |
          PROJECT="$(find source -name settings.gradle.kts -printf '%h\n' | head -1)"
          test -n "$PROJECT"
          cd "$PROJECT"
          # Loom 1.3.10 cannot handle the mixin remap type used by this project.
          sed -i 's/version "1.3.10"/version "1.6.12"/' build.gradle.kts
          # Minecraft 1.20.1 exposes these MobEntity NBT hooks as public.
          sed -i 's/protected void writeCustomDataToNbt/public void writeCustomDataToNbt/' src/main/java/com/riko/biggerdigger/entity/BiggerDiggerEntity.java
          sed -i 's/protected void readCustomDataFromNbt/public void readCustomDataFromNbt/' src/main/java/com/riko/biggerdigger/entity/BiggerDiggerEntity.java
          gradle --no-daemon clean build
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: BiggerDigger-Fabric-1.20.1
          path: source/**/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
